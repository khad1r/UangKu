name: Build Production Docker Image And Deploy To Cloud Run

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: khad1r/uangku
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GC_CR_REGION }}
  SERVICE_NAME: uangku

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'Main' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker tags
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "DOCKER_TAGS=${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAGS=${{ env.IMAGE_NAME }}:sha-${{ github.sha }},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile.production
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.DOCKER_TAGS }}
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Test Docker image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} php -v
          docker run --rm ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} frankenphp version

      - name: Google Auth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        # ONLY deploy on main branch pushes, NOT on tags or pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          # Explicitly use the SHA tag for the deployment to ensure immutability
          image: docker.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
